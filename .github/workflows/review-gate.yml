# Fork-owned workflow (qvictl/weread.koplugin): not part of upstream.
#
# Review gate (see REVIEW_POLICY.md): evaluates open PRs to the default branch
# with .github/review-gate/review_gate.py and keeps one sticky comment per PR.
# It approves as github-actions[bot] and enables auto-merge (squash) only
# when every condition holds: required checks green, an AI reviewer
# (CodeRabbit / Gemini Code Assist) reviewed the head commit without
# requesting changes, no unresolved thread, <= 500 changed non-test/doc
# lines, no sensitive path, not draft / do-not-merge, trusted author. The
# `human-approved` label (admins / maintainers only) waives size, sensitive
# paths and the first-time-contributor rule, never checks, AI review or
# threads. It dismisses its own approval when a condition stops holding.
#
# Security: the gate script always comes from the default branch, never from
# the PR (pull_request_target / workflow_run / schedule run the default
# branch's workflow; the review events run the PR's copy of this file, so the
# checkout below pins the script to the default branch). PR code is never
# checked out or executed.
#
# Triggers: PR events, AI / human reviews and review comments, completion of
# the required-check workflows, commit statuses and third-party check suites,
# and a 15-minute schedule as a safety net (review-thread resolution has no
# workflow trigger: the schedule picks it up). Repository variable
# REVIEW_GATE_DRY_RUN=true turns it into report-only. Secret
# REVIEW_GATE_MERGE_TOKEN (fine-grained PAT: contents + pull requests write)
# lets it enable auto-merge; without it, approved PRs are merged by hand.

name: Review gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [CI, Integration, PR policy]
    types: [completed]
  check_suite:
    types: [completed]
  status:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number (empty: every open PR)'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read
  statuses: read

concurrency:
  group: review-gate-${{ github.event.pull_request.number || inputs.pr || (github.event_name == 'schedule' && 'all') || github.run_id }}
  cancel-in-progress: ${{ github.event.pull_request.number != null }}

jobs:

  gate:
    name: Review gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skip runs caused by the gate's own reviews, and PRs to other branches.
    if: >-
      github.event.sender.login != 'github-actions[bot]' &&
      (github.event.pull_request == null ||
       github.event.pull_request.base.ref == github.event.repository.default_branch)
    steps:
      - name: Checkout the gate (default branch only)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          persist-credentials: false
          sparse-checkout: .github/review-gate
          sparse-checkout-cone-mode: false
      - name: Evaluate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_GATE_MERGE_TOKEN: ${{ secrets.REVIEW_GATE_MERGE_TOKEN }}
          REVIEW_GATE_DRY_RUN: ${{ vars.REVIEW_GATE_DRY_RUN }}
        run: python3 .github/review-gate/review_gate.py --repo "$GITHUB_REPOSITORY" --event
