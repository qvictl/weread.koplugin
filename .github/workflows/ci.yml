name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Also dispatched by the upstream-sync workflow for its PR branch (PRs
  # opened with GITHUB_TOKEN do not trigger pull_request workflows).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lua:
    name: Lua lint and specs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Lua tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit luarocks libsqlite3-0
          sudo luarocks install luacheck

      - name: Install ripgrep with PCRE2
        uses: ./.github/actions/setup-ripgrep

      - name: Lua namespace policy
        run: bash scripts/check_lua_namespace.sh

      - name: Lua static analysis
        run: luacheck main.lua _meta.lua weread integrations spec

      - name: Lua syntax check
        run: |
          find . -name '*.lua' \
            -not -path './.git/*' \
            -print0 | while IFS= read -r -d '' file; do
              luajit -b "$file" /tmp/luajit-check.out
            done

      - name: Lua unit and component specs
        run: bash scripts/run_lua_specs.sh

  python:
    name: Python scripts and mock service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python syntax check
        run: python3 -m py_compile scripts/*.py

      - name: Offline mock service contract
        run: python3 scripts/test_mock_weread.py

      - name: Emulator scenario inventory
        run: python3 scripts/run_emulator_scenarios.py --list

      - name: CLI smoke of CI tooling
        run: |
          python3 scripts/run_emulator_scenarios.py --help > /dev/null
          python3 scripts/check_test_policy.py --help > /dev/null
          for command in merge report diff total gate baseline; do
            python3 scripts/coverage_tools.py "$command" --help > /dev/null
          done
          python3 -c "import json; json.load(open('.ci/coverage-policy.json'))"

  package:
    name: Package and changelog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Version consistency
        run: |
          meta="$(sed -nE 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' _meta.lua | head -n 1)"
          main="$(sed -nE 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' main.lua | head -n 1)"
          echo "_meta.lua=$meta main.lua=$main"
          test -n "$meta" && test "$meta" = "$main"

      - name: Release package smoke test
        run: |
          bash scripts/package_release.sh /tmp/weread.koplugin-release-test.zip
          unzip -Z1 /tmp/weread.koplugin-release-test.zip | grep -qx 'weread.koplugin/main.lua'
          if unzip -Z1 /tmp/weread.koplugin-release-test.zip \
            | grep -Eq '^weread\.koplugin/(spec|scripts|docs|\.github)/'; then
            echo "error: development-only files in the release package" >&2
            exit 1
          fi

      - name: Release changelog check
        run: |
          version="$(
            sed -nE 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' \
              _meta.lua | head -n 1
          )"
          bash scripts/extract_release_notes.sh "$version" /tmp/release-preface.md
          grep -qx '## 新功能与改进' /tmp/release-preface.md

  secrets:
    name: Sensitive information scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install ripgrep with PCRE2
        uses: ./.github/actions/setup-ripgrep

      - name: Scan for credentials
        run: bash scripts/check_secrets.sh

  ci:
    # Required status check for main. Stays green only if every job above
    # succeeded (a skipped or cancelled job fails it too).
    name: ci
    if: always()
    needs: [lua, python, package, secrets]
    runs-on: ubuntu-latest
    steps:
      - name: All CI jobs passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success")' > /dev/null
