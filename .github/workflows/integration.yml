name: Integration

# Real KOReader tests run only through Release, at its exact candidate SHA.
# Artifacts belong to the outer Release run. All three test families remain.

on:
  workflow_call:
    inputs:
      target_sha:
        required: true
        type: string
      fork_release:
        type: string
        default: nightly

permissions:
  contents: read

env:
  LUACOV_VERSION: v0.16.0

concurrency:
  group: release-integration-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  emulator-fork:
    name: Emulator · qvictl/koreader fork build (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # The fork's emulator build links the system's SDL3: same image as the
    # fork's own integration tests. Its default user `ko` has the runner's
    # UID (1001), so the mounted workspace and $RUNNER_TEMP stay writable.
    container:
      image: koreader/kobase:5.0.0-22.04
    defaults:
      run:
        shell: bash
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check container tools
        id: tools
        # kobase ships these; install whatever a future image drops.
        run: |
          set -euo pipefail
          id
          missing=()
          for pair in bash:bash curl:curl git:git python3:python3 sha256sum:coreutils \
                      tar:tar xz:xz-utils zip:zip unzip:unzip; do
            command -v "${pair%%:*}" >/dev/null || missing+=("${pair#*:}")
          done
          if (( ${#missing[@]} )); then
            echo "Installing ${missing[*]}"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${missing[@]}"
          fi
          python3 --version
          echo "out=$RUNNER_TEMP/emulator" >> "$GITHUB_OUTPUT"

      - name: Checkout plugin
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Install LuaCov
        run: |
          git clone --quiet --depth 1 --branch "$LUACOV_VERSION" \
            https://github.com/lunarmodules/luacov.git "$RUNNER_TEMP/luacov"

      - name: Fetch the qvictl/koreader fork emulator build
        id: koreader
        env:
          KOREADER_EMULATOR_SOURCE: fork
          KOREADER_FORK_RELEASE: ${{ inputs.fork_release || 'nightly' }}
        run: bash scripts/fetch_koreader_emulator.sh "$RUNNER_TEMP/koreader"

      - name: Run emulator scenarios
        env:
          RUNTIME: ${{ steps.koreader.outputs.runtime }}
          LABEL: ${{ steps.koreader.outputs.label }}
          OUT: ${{ steps.tools.outputs.out }}
        run: |
          python3 scripts/run_emulator_scenarios.py \
            --koreader "$RUNTIME" \
            --label "$LABEL" \
            --shard "${{ matrix.shard }}/3" \
            --coverage --luacov-src "$RUNNER_TEMP/luacov/src" \
            --out "$OUT"

      - name: Scenario summary
        if: always()
        env:
          OUT: ${{ steps.tools.outputs.out }}
        run: |
          if [[ -f "$OUT/summary.md" ]]; then
            cat "$OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No scenario summary was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      # A reusable workflow keeps the caller's github.sha, which can differ
      # from the exact release candidate checked out above.
      - name: Record the measured commit
        if: always() && steps.tools.outputs.out != ''
        env:
          OUT: ${{ steps.tools.outputs.out }}
          MEASURED_SHA: ${{ inputs.target_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$MEASURED_SHA"
          mkdir -p "$OUT/coverage"
          echo "$MEASURED_SHA" > "$OUT/coverage/measured-commit.txt"

      # Artifact paths come from the step output, not ${{ runner.temp }}:
      # inside a container job that expression is the host path.
      - name: Upload emulator coverage
        if: always() && steps.tools.outputs.out != ''
        uses: actions/upload-artifact@v6
        with:
          name: coverage-emulator-shard-${{ matrix.shard }}
          path: |
            ${{ steps.tools.outputs.out }}/coverage/emulator.stats.out
            ${{ steps.tools.outputs.out }}/coverage/measured-commit.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Upload scenario evidence
        if: always() && steps.tools.outputs.out != ''
        uses: actions/upload-artifact@v6
        with:
          name: emulator-evidence-shard-${{ matrix.shard }}
          path: |
            ${{ steps.tools.outputs.out }}/*/evidence
            ${{ steps.tools.outputs.out }}/summary.*
          if-no-files-found: warn
          retention-days: 14

  emulator-official:
    name: Emulator · official KOReader v2026.07.1 (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # No LuaCov here (the JIT stays on), so two shards are enough.
        shard: [1, 2]
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-2.0-0 zip unzip

      - name: Fetch the official KOReader build
        id: koreader
        env:
          KOREADER_EMULATOR_SOURCE: official
        run: bash scripts/fetch_koreader_emulator.sh "$RUNNER_TEMP/koreader"

      - name: Run emulator scenarios
        env:
          RUNTIME: ${{ steps.koreader.outputs.runtime }}
          LABEL: ${{ steps.koreader.outputs.label }}
        run: |
          python3 scripts/run_emulator_scenarios.py \
            --koreader "$RUNTIME" \
            --label "$LABEL" \
            --shard "${{ matrix.shard }}/2" \
            --out "$RUNNER_TEMP/emulator"

      - name: Scenario summary
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/emulator/summary.md" ]]; then
            cat "$RUNNER_TEMP/emulator/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No scenario summary was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Distinct name: coverage-emulator-shard-* is the fork job's alone.
      - name: Upload scenario evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: emulator-official-evidence-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/emulator/*/evidence
            ${{ runner.temp }}/emulator/summary.*
          if-no-files-found: warn
          retention-days: 14

  plugin-loader:
    name: PluginLoader (pinned KOReader)
    runs-on: ubuntu-latest
    container:
      image: koreader/kobase:1.0.0-22.04
    timeout-minutes: 60
    env:
      KOREADER_COMMIT: 1e2fa5f1239028ab4b37acae833cdc86a71e5258
      EMULATE_READER: "1"
      MAKEFLAGS: OUTPUT_DIR=build PARALLEL_JOBS=3 INSTALL_DIR=install

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Checkout pinned KOReader
        uses: actions/checkout@v6
        with:
          repository: koreader/koreader
          persist-credentials: false
          ref: ${{ env.KOREADER_COMMIT }}
          path: .koreader-integration
          submodules: recursive
          fetch-depth: 0

      - name: Restore KOReader build cache
        uses: actions/cache@v5
        with:
          path: .koreader-integration/build
          key: koreader-linux-${{ env.KOREADER_COMMIT }}-v1

      - name: Run real PluginLoader integration spec
        env:
          KOREADER_DIR: ${{ github.workspace }}/.koreader-integration
          KOREADER_SKIP_FETCH: "1"
        run: bash scripts/run_koreader_integration.sh

  integration:
    # Required status check for main: the qvictl/koreader fork build.
    name: integration
    if: always()
    needs: [emulator-fork, plugin-loader]
    runs-on: ubuntu-latest
    steps:
      - name: All fork-build integration jobs passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success")' > /dev/null

  integration-official:
    # Required status check for main: official KOReader v2026.07.1.
    name: integration-official
    if: always()
    needs: [emulator-official]
    runs-on: ubuntu-latest
    steps:
      - name: All official-build integration jobs passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success")' > /dev/null
