name: Coverage

# Release persists authentic full measurements synchronously. Manual dispatch
# can backfill historical runs; ordinary main CI never republishes partial UT.
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful main CI/Release run (default latest CI)
        required: false
      integration_run:
        description: Legacy source_run alias for historical main Integration data
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: coverage-main-${{ inputs.source_run || inputs.integration_run || github.run_id }}
  cancel-in-progress: false
jobs:
  resolve:
    name: Resolve authentic measurement
    runs-on: ubuntu-latest
    outputs:
      measure: ${{ steps.run.outputs.measure }}
      sha: ${{ steps.run.outputs.sha }}
      combined: ${{ steps.run.outputs.combined }}
      run_id: ${{ steps.run.outputs.run_id }}
    steps:
      - name: Checkout coverage tooling
        run: |
          tools="$RUNNER_TEMP/coverage-tooling"
          git init --quiet "$tools"
          git -C "$tools" sparse-checkout set --no-cone /scripts/download_emulator_coverage.py /scripts/coverage_tools.py /scripts/select_lua_tests.py
          GIT_TERMINAL_PROMPT=0 git -C "$tools" -c credential.helper= fetch --quiet --depth 1 \
            "https://github.com/$GITHUB_REPOSITORY.git" "$GITHUB_WORKFLOW_SHA"
          git -C "$tools" checkout --quiet --detach FETCH_HEAD

      - name: Resolve source run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN: ${{ inputs.source_run }}
          LEGACY_RUN: ${{ inputs.integration_run }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_RUN" && -n "$LEGACY_RUN" && "$INPUT_RUN" != "$LEGACY_RUN" ]]; then
            echo "::error::Conflicting coverage source run IDs."
            exit 1
          fi
          run_id="${INPUT_RUN:-${LEGACY_RUN:-}}"
          if [[ -z "$run_id" ]]; then
            run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=100" \
              --jq '[.workflow_runs[] | select(.event != "pull_request")][0].id // 0')"
          fi
          [[ "$run_id" =~ ^[0-9]+$ ]]
          python3 "$RUNNER_TEMP/coverage-tooling/scripts/download_emulator_coverage.py" \
            --repo "$GITHUB_REPOSITORY" --run "$run_id" --source-out "$RUNNER_TEMP/source.json"
          {
            echo "run_id=$run_id"
            echo "measure=$(jq -r .measure "$RUNNER_TEMP/source.json")"
            echo "sha=$(jq -r '.sha // ""' "$RUNNER_TEMP/source.json")"
            echo "combined=$(jq -r '.combined // false' "$RUNNER_TEMP/source.json")"
          } >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/source.json" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish main coverage
    needs: resolve
    if: needs.resolve.outputs.measure == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout coverage tooling
        run: |
          tools="$RUNNER_TEMP/coverage-tooling"
          git init --quiet "$tools"
          git -C "$tools" sparse-checkout set --no-cone /scripts/download_emulator_coverage.py /scripts/coverage_tools.py /scripts/select_lua_tests.py
          GIT_TERMINAL_PROMPT=0 git -C "$tools" -c credential.helper= fetch --quiet --depth 1 \
            "https://github.com/$GITHUB_REPOSITORY.git" "$GITHUB_WORKFLOW_SHA"
          git -C "$tools" checkout --quiet --detach FETCH_HEAD

      - name: Download exact emulator coverage
        if: needs.resolve.outputs.combined == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ needs.resolve.outputs.run_id }}
          TARGET_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          python3 "$RUNNER_TEMP/coverage-tooling/scripts/download_emulator_coverage.py" \
            --repo "$GITHUB_REPOSITORY" --run "$RUN_ID" --expected-sha "$TARGET_SHA" \
            --out "$RUNNER_TEMP/emulator-coverage"

      - name: Checkout the measured commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate measured main ancestry
        run: |
          git fetch --quiet --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::The measured coverage source is not an ancestor of main."
            exit 1
          fi

      - name: Install LuaJIT and LuaCov
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit libsqlite3-0
          git clone --quiet --depth 1 --branch v0.16.0 https://github.com/lunarmodules/luacov.git "$RUNNER_TEMP/luacov"
          echo "LUA_PATH=$RUNNER_TEMP/luacov/src/?.lua;;" >> "$GITHUB_ENV"

      - name: Normal full unit backfill checks
        run: bash scripts/run_lua_specs.sh

      - name: Unit specs under LuaCov
        run: bash scripts/run_lua_coverage.sh

      - name: Combine authentic release coverage
        if: needs.resolve.outputs.combined == 'true'
        env:
          COVERAGE_REPO: ${{ github.workspace }}
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/coverage-tooling/scripts/coverage_tools.py"
          python3 "$tool" merge --all-files --out coverage/combined.stats.out coverage/unit.stats.out "$RUNNER_TEMP/emulator-coverage"
          python3 "$tool" report coverage/combined.stats.out coverage/combined.report.out
          python3 "$tool" total coverage/combined.report.out

      - name: Update the coverage branch
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.resolve.outputs.sha }}
          COMBINED: ${{ needs.resolve.outputs.combined }}
          COVERAGE_REPO: ${{ github.workspace }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ needs.resolve.outputs.run_id }}
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/coverage-site"
          publish() {
            git fetch --quiet --no-tags origin main:refs/remotes/origin/main || return 1
            git merge-base --is-ancestor "$SHA" origin/main || return 1
            if git fetch --no-tags origin +coverage:refs/remotes/origin/coverage 2>/dev/null; then
              if [[ -d "$site" ]]; then
                git -C "$site" checkout -q -B coverage origin/coverage || return 1
              else
                git worktree add -q "$site" origin/coverage || return 1
                git -C "$site" checkout -q -B coverage || return 1
              fi
            elif [[ ! -d "$site" ]]; then
              git worktree add -q --detach "$site" || return 1
              git -C "$site" checkout -q --orphan coverage || return 1
              git -C "$site" rm -rfq . || return 1
            fi
            combined_args=()
            if [[ "$COMBINED" == "true" ]]; then combined_args=(--combined coverage/combined.report.out); fi
            python3 "$RUNNER_TEMP/coverage-tooling/scripts/coverage_tools.py" baseline \
              --unit coverage/unit.report.out "${combined_args[@]}" \
              --sha "$SHA" --run-url "$RUN_URL" --out-dir "$site" || return 1
            git -C "$site" add -A baseline.json history.jsonl badge-unit.json README.md || return 1
            if [[ -f "$site/badge.json" ]]; then git -C "$site" add badge.json || return 1; fi
            if git -C "$site" diff --cached --quiet; then
              echo "Coverage for $SHA unchanged."
              return 0
            fi
            git -C "$site" -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -q -m "coverage: ${SHA:0:8} $(record '.combined.percent // "not measured"') (unit $(record .unit.percent)%)" || return 1
            git -C "$site" -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin coverage
          }
          record() { jq -r --arg sha "$SHA" "select(.sha == \$sha) | $1" "$site/history.jsonl" | tail -n 1; }
          for attempt in 1 2 3 4 5; do
            if publish; then
              break
            fi
            if (( attempt == 5 )); then
              echo "::error::Could not push the coverage branch."
              exit 1
            fi
            echo "Push raced with another coverage run; retrying ($attempt)."
            sleep $((attempt * 5))
          done
          {
            echo "### Coverage on main @ ${SHA:0:8}"
            echo
            echo "- unit + emulator: $(record '.combined.percent // "not measured"')"
            echo "- unit: $(record .unit.percent)%"
          } >> "$GITHUB_STEP_SUMMARY"
