name: Coverage

# After every successful Integration run on main: combine unit-spec and
# emulator-scenario line coverage of the whole plugin and publish it on the
# `coverage` branch:
#   history.jsonl  one record per main commit, keyed by SHA: the tests-policy
#                  ratchet reads the record of the PR's own base commit (or
#                  its nearest recorded ancestor), plus the trend
#   baseline.json  newest main commit's record (never moved back by a run
#                  that finishes out of order)
#   badge.json     shields.io endpoint for the README badge (unit + emulator)
#   badge-unit.json, README.md (history table)
# One concurrency group per commit, so a burst of merges does not cancel the
# pending runs in between; pushes to the branch retry on a race. A commit
# whose Integration run failed or was superseded gets no record: PRs based
# on it fall back to its nearest recorded ancestor (re-run this workflow with
# `integration_run` to fill it in). The branch holds no workflow files, so
# GITHUB_TOKEN may push it.

on:
  workflow_run:
    workflows:
      - Integration
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      integration_run:
        description: Integration run id on main to take emulator coverage from (default latest successful)
        required: false

permissions:
  contents: write
  actions: read

concurrency:
  group: coverage-main-${{ github.event.workflow_run.head_sha || inputs.integration_run || github.run_id }}
  cancel-in-progress: false

env:
  LUACOV_VERSION: v0.16.0

jobs:
  publish:
    name: Publish main coverage
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve Integration run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_RUN: ${{ github.event.workflow_run.id }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_RUN: ${{ inputs.integration_run }}
        run: |
          set -euo pipefail
          if [[ -n "${EVENT_RUN:-}" ]]; then
            run_id="$EVENT_RUN"; sha="$EVENT_SHA"
          elif [[ -n "${INPUT_RUN:-}" ]]; then
            run_id="$INPUT_RUN"
            run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
            if ! jq -e '.event != "pull_request" and .head_branch == "main"' <<<"$run_json" >/dev/null; then
              echo "::error::Coverage backfills require an Integration run on main."
              exit 1
            fi
            sha="$(jq -r .head_sha <<<"$run_json")"
          else
            read -r run_id sha < <(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/integration.yml/runs?branch=main&status=success&per_page=20" \
              --jq '[.workflow_runs[] | select(.event != "pull_request")][0] | "\(.id) \(.head_sha)"')
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Integration run $run_id at $sha"

      # Historical measured commits may predate the artifact downloader.
      - name: Checkout coverage tooling
        run: |
          tools="$RUNNER_TEMP/coverage-tooling"
          git init --quiet "$tools"
          git -C "$tools" sparse-checkout set --no-cone /scripts/download_emulator_coverage.py
          GIT_TERMINAL_PROMPT=0 git -C "$tools" -c credential.helper= fetch --quiet --depth 1 \
            "https://github.com/$GITHUB_REPOSITORY.git" "$GITHUB_WORKFLOW_SHA"
          git -C "$tools" checkout --quiet --detach FETCH_HEAD

      - name: Download emulator coverage
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: |
          python3 "$RUNNER_TEMP/coverage-tooling/scripts/download_emulator_coverage.py" --repo "$GITHUB_REPOSITORY" \
            --run "$RUN_ID" --out "$RUNNER_TEMP/emulator-coverage"

      - name: Checkout the measured commit
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.run.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate measured main ancestry
        run: |
          git fetch --quiet --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::The measured coverage source is not an ancestor of main."
            exit 1
          fi

      - name: Install LuaJIT and LuaCov
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit libsqlite3-0
          git clone --quiet --depth 1 --branch "$LUACOV_VERSION" \
            https://github.com/lunarmodules/luacov.git "$RUNNER_TEMP/luacov"
          echo "LUA_PATH=$RUNNER_TEMP/luacov/src/?.lua;;" >> "$GITHUB_ENV"

      - name: Unit specs under LuaCov
        run: bash scripts/run_lua_coverage.sh

      - name: Combine with emulator coverage
        run: |
          set -euo pipefail
          python3 scripts/coverage_tools.py merge --all-files --out coverage/combined.stats.out \
            coverage/unit.stats.out "$RUNNER_TEMP/emulator-coverage"
          python3 scripts/coverage_tools.py report coverage/combined.stats.out coverage/combined.report.out
          python3 scripts/coverage_tools.py total coverage/combined.report.out

      - name: Update the coverage branch
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.run.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ steps.run.outputs.run_id }}
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/coverage-site"
          publish() {
            if git fetch --no-tags origin +coverage:refs/remotes/origin/coverage 2>/dev/null; then
              if [[ -d "$site" ]]; then
                git -C "$site" checkout -q -B coverage origin/coverage || return 1
              else
                git worktree add -q "$site" origin/coverage || return 1
                git -C "$site" checkout -q -B coverage || return 1
              fi
            elif [[ ! -d "$site" ]]; then
              git worktree add -q --detach "$site" || return 1
              git -C "$site" checkout -q --orphan coverage || return 1
              git -C "$site" rm -rfq . || return 1
            fi
            # A re-run for an already published commit replaces its record.
            python3 scripts/coverage_tools.py baseline \
              --unit coverage/unit.report.out --combined coverage/combined.report.out \
              --sha "$SHA" --run-url "$RUN_URL" --out-dir "$site" || return 1
            git -C "$site" add -A baseline.json history.jsonl badge.json badge-unit.json README.md || return 1
            if git -C "$site" diff --cached --quiet; then
              echo "Coverage for $SHA unchanged."
              return 0
            fi
            git -C "$site" -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -q -m "coverage: ${SHA:0:8} $(record .combined.percent)% (unit $(record .unit.percent)%)" || return 1
            git -C "$site" -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin coverage
          }
          record() { jq -r --arg sha "$SHA" "select(.sha == \$sha) | $1" "$site/history.jsonl" | tail -n 1; }
          for attempt in 1 2 3 4 5; do
            if publish; then
              break
            fi
            if (( attempt == 5 )); then
              echo "::error::Could not push the coverage branch."
              exit 1
            fi
            echo "Push raced with another coverage run; retrying ($attempt)."
            sleep $((attempt * 5))
          done
          {
            echo "### Coverage on main @ ${SHA:0:8}"
            echo
            echo "- unit + emulator: $(record .combined.percent)%"
            echo "- unit: $(record .unit.percent)%"
          } >> "$GITHUB_STEP_SUMMARY"
