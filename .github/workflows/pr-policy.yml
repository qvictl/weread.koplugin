name: PR policy

# PRs run affected Lua specs and require unit diff >=80%. Whole-plugin
# unit/combined ratchets and dated/module floors are full-suite Release gates.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number (used by the upstream-sync workflow)
        required: true

permissions:
  contents: read
  pull-requests: write
  actions: read

concurrency:
  group: pr-policy-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

env:
  LUACOV_VERSION: v0.16.0

jobs:
  tests-policy:
    name: tests-policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          data="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          {
            echo "number=$PR_NUMBER"
            echo "base_ref=$(jq -r .base.ref <<<"$data")"
            echo "base_target_sha=${EVENT_BASE_SHA:-$(jq -r .base.sha <<<"$data")}"
            echo "head_sha=${EVENT_HEAD_SHA:-$(jq -r .head.sha <<<"$data")}"
            echo "same_repo=$(jq -r '.head.repo.full_name == .base.repo.full_name' <<<"$data")"
            echo "labels=$(jq -r '[.labels[].name] | join(",")' <<<"$data")"
          } >> "$GITHUB_OUTPUT"
          jq -r .title <<<"$data" > "$RUNNER_TEMP/title.txt"
          # Branch names may hold shell metacharacters: steps read it from the
          # environment, never via expression expansion into the script.
          echo "BASE_REF=$(jq -r .base.ref <<<"$data")" >> "$GITHUB_ENV"

      - name: Checkout pull request head
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch base branch
        run: |
          git fetch --no-tags origin "$BASE_REF:refs/remotes/origin/$BASE_REF"

      # Pin dispatch/historical-head tooling to this workflow revision. A PR can
      # still edit its workflow and policy; latest-head review is the trust boundary.
      - name: Checkout coverage tooling
        run: |
          tools="$RUNNER_TEMP/coverage-tooling"
          git init --quiet "$tools"
          git -C "$tools" sparse-checkout set --no-cone /scripts/download_emulator_coverage.py /scripts/coverage_tools.py /scripts/select_lua_tests.py
          GIT_TERMINAL_PROMPT=0 git -C "$tools" -c credential.helper= fetch --quiet --depth 1 \
            "https://github.com/$GITHUB_REPOSITORY.git" "$GITHUB_WORKFLOW_SHA"
          git -C "$tools" checkout --quiet --detach FETCH_HEAD

      - name: Measure the pull request against its own base
        id: measured
        env:
          BASE_TARGET: ${{ steps.pr.outputs.base_target_sha }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(git merge-base HEAD "$BASE_TARGET")" >> "$GITHUB_OUTPUT"

      - name: Select affected Lua specs
        env:
          BASE_SHA: ${{ steps.measured.outputs.base_sha }}
        run: |
          python3 scripts/select_lua_tests.py --base "$BASE_SHA" --head HEAD --out "$RUNNER_TEMP/unit-selection.json"
          cat "$RUNNER_TEMP/unit-selection.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Tests accompany code changes
        id: policy
        continue-on-error: true
        env:
          LABELS: ${{ steps.pr.outputs.labels }}
          BASE_SHA: ${{ steps.measured.outputs.base_sha }}
        run: |
          python3 scripts/check_test_policy.py \
            --base "$BASE_SHA" \
            --head HEAD \
            --labels "$LABELS" \
            --title "$(cat "$RUNNER_TEMP/title.txt")" \
            --summary "$RUNNER_TEMP/policy.md"

      - name: Install LuaJIT and LuaCov
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit libsqlite3-0
          git clone --quiet --depth 1 --branch "$LUACOV_VERSION" \
            https://github.com/lunarmodules/luacov.git "$RUNNER_TEMP/luacov"
          echo "LUA_PATH=$RUNNER_TEMP/luacov/src/?.lua;;" >> "$GITHUB_ENV"

      - name: Test selection and coverage runners
        run: python3 scripts/test_select_lua_tests.py

      - name: Unit specs under LuaCov
        run: bash scripts/run_lua_coverage.sh --manifest "$RUNNER_TEMP/unit-selection.json"

      - name: Upload selected coverage manifest
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-test-selection
          path: ${{ runner.temp }}/unit-selection.json

      - name: Coverage gates
        id: coverage
        continue-on-error: true
        env:
          LABELS: ${{ steps.pr.outputs.labels }}
          BASE_SHA: ${{ steps.measured.outputs.base_sha }}
        run: |
          set -euo pipefail
          COVERAGE_REPO="$GITHUB_WORKSPACE" python3 "$RUNNER_TEMP/coverage-tooling/scripts/coverage_tools.py" gate \
            --mode diff --unit coverage/unit.report.out \
            --base "origin/$BASE_REF" --base-sha "$BASE_SHA" --head HEAD \
            --labels "$LABELS" --selection-manifest "$RUNNER_TEMP/unit-selection.json" \
            --summary "$RUNNER_TEMP/coverage.md" --json "$RUNNER_TEMP/coverage.json"

      - name: Compose summary
        if: always()
        env:
          MEASURED_SHA: ${{ steps.measured.outputs.sha }}
          BASE_SHA: ${{ steps.measured.outputs.base_sha }}
        run: |
          {
            echo "<!-- weread-tests-policy -->"
            cat "$RUNNER_TEMP/policy.md" 2>/dev/null || echo "Test policy did not run."
            echo
            cat "$RUNNER_TEMP/coverage.md" 2>/dev/null || echo "Coverage gates did not run."
            echo
            if [[ -n "$MEASURED_SHA" ]]; then
              echo "_Measured commit \`${MEASURED_SHA:0:8}\`; full-PR diff base: \`${BASE_SHA:0:8}\`._"
              echo
            fi
            echo "_Policy: \`.ci/coverage-policy.json\` · labels: \`no-tests-needed\` (maintainers; docs, comments or log wording only) waives the test rule and the diff-coverage gates, \`upstream-sync\` marks automated upstream merges._"
          } > "$RUNNER_TEMP/comment.md"
          cat "$RUNNER_TEMP/comment.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Post sticky PR comment
        if: always() && steps.pr.outputs.same_repo == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          existing="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- weread-tests-policy -->")) | .id' | head -n 1)"
          if [[ -n "$existing" ]]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F body=@"$RUNNER_TEMP/comment.md" >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F body=@"$RUNNER_TEMP/comment.md" >/dev/null
          fi

      - name: Enforce policy
        env:
          POLICY: ${{ steps.policy.outcome }}
          COVERAGE: ${{ steps.coverage.outcome }}
        run: |
          echo "test policy: $POLICY, coverage gates: $COVERAGE"
          if [[ "$POLICY" != "success" ]]; then
            echo "::error::Test policy failed (see summary)."
            exit 1
          fi
          if [[ "$COVERAGE" != "success" ]]; then
            echo "::error::A blocking coverage gate failed (see summary)."
            exit 1
          fi
