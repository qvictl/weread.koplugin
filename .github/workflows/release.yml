name: Release

# A normal main CI completion probes only the version. Real KOReader tests
# start for a new, untagged version commit, or an explicit manual candidate.
on:
  workflow_dispatch:
    inputs:
      package_label:
        description: Optional label for a package-only candidate
        required: false
        type: string
      publish:
        description: Publish an untagged version from main after all release gates
        type: boolean
        default: false
      fork_release:
        description: Fork emulator release to validate (official runtime also runs)
        type: string
        default: nightly
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: release-candidates
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve release candidate
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      candidate: ${{ steps.version.outputs.candidate }}
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}
      archive: ${{ steps.version.outputs.archive }}
      target_sha: ${{ steps.version.outputs.target_sha }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Read version and select candidate
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_LABEL: ${{ inputs.package_label }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          EVENT_CI_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          read_version() {
            sed -nE 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' | head -n 1
          }
          current="$(read_version < _meta.lua)"
          [[ "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$current"
          candidate=false
          publish=false
          ci_run=0
          label="${MANUAL_LABEL:-${TARGET_SHA:0:8}}"
          if [[ "$EVENT_NAME" == "workflow_run" || "$MANUAL_PUBLISH" == "true" ]]; then
            if [[ "$EVENT_NAME" != "workflow_run" && "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "::error::Publishing is allowed only from main."
              exit 1
            fi
            label="$tag"
            previous="$(git show HEAD^:_meta.lua 2>/dev/null | read_version || true)"
            if ! git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
              if [[ "$EVENT_NAME" == "workflow_dispatch" || "$current" != "$previous" ]]; then
                candidate=true
                publish=true
              fi
            fi
          else
            [[ "$label" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,39}$ ]]
            candidate=true
          fi
          if [[ "$candidate" == "true" ]]; then
            if [[ -n "$EVENT_CI_RUN" ]]; then
              ci_run="$EVENT_CI_RUN"
            else
              ci_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$TARGET_SHA&status=success&per_page=100" \
                --jq '[.workflow_runs[] | select(.conclusion == "success")][0].id // 0')"
            fi
            ci="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ci_run")"
            jq -e --arg sha "$TARGET_SHA" '.path == ".github/workflows/ci.yml" and .conclusion == "success" and .head_sha == $sha' <<<"$ci" >/dev/null
            if [[ "$publish" == "true" ]]; then
              jq -e '.event != "pull_request" and .head_branch == "main"' <<<"$ci" >/dev/null
              git fetch --quiet --no-tags origin main:refs/remotes/origin/main
              git merge-base --is-ancestor HEAD origin/main
            fi
          fi
          {
            echo "candidate=$candidate"
            echo "publish=$publish"
            echo "version=$current"
            echo "tag=$tag"
            echo "artifact_name=weread.koplugin-$label"
            echo "archive=dist/weread.koplugin-$label.zip"
            echo "target_sha=$TARGET_SHA"
          } >> "$GITHUB_OUTPUT"
          CANDIDATE="$candidate" CI_RUN="$ci_run" python3 -c 'import json,os; json.dump(dict(run_id=int(os.environ["GITHUB_RUN_ID"]),candidate=os.environ["CANDIDATE"]=="true",target_sha=os.environ["TARGET_SHA"],ci_run=int(os.environ["CI_RUN"])),open(os.environ["RUNNER_TEMP"]+"/candidate.json","w"))'
          echo "candidate=$candidate publish=$publish version=$current source=$TARGET_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Record candidate provenance
        uses: actions/upload-artifact@v6
        with:
          name: release-candidate
          path: ${{ runner.temp }}/candidate.json
          if-no-files-found: error
          retention-days: 30

  integration:
    name: Validate release in KOReader
    needs: resolve
    if: needs.resolve.outputs.candidate == 'true'
    uses: ./.github/workflows/integration.yml
    with:
      target_sha: ${{ needs.resolve.outputs.target_sha }}
      fork_release: ${{ inputs.fork_release || 'nightly' }}
    permissions:
      contents: read

  coverage:
    name: Release combined coverage gate
    needs: [resolve, integration]
    if: needs.resolve.outputs.candidate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout coverage tooling
        run: |
          tools="$RUNNER_TEMP/coverage-tooling"
          git init --quiet "$tools"
          git -C "$tools" sparse-checkout set --no-cone /scripts/download_emulator_coverage.py /scripts/coverage_tools.py
          GIT_TERMINAL_PROMPT=0 git -C "$tools" -c credential.helper= fetch --quiet --depth 1 \
            "https://github.com/$GITHUB_REPOSITORY.git" "$GITHUB_WORKFLOW_SHA"
          git -C "$tools" checkout --quiet --detach FETCH_HEAD

      - name: Checkout measured candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch authentic coverage history
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          mkdir -p "$RUNNER_TEMP/baseline"
          git fetch --no-tags --depth 1 origin coverage:refs/remotes/origin/coverage
          git show origin/coverage:history.jsonl > "$RUNNER_TEMP/baseline/history.jsonl"
          test -s "$RUNNER_TEMP/baseline/history.jsonl"
          jq -e -s 'map(select(type == "object" and .sha != null and .unit.percent != null)) | length > 0' \
            "$RUNNER_TEMP/baseline/history.jsonl" >/dev/null

      - name: Download exact candidate emulator coverage
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.resolve.outputs.target_sha }}
        run: |
          python3 "$RUNNER_TEMP/coverage-tooling/scripts/download_emulator_coverage.py" \
            --repo "$GITHUB_REPOSITORY" --run "$GITHUB_RUN_ID" --expected-sha "$TARGET_SHA" \
            --out "$RUNNER_TEMP/emulator-coverage"

      - name: Install LuaJIT and LuaCov
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit libsqlite3-0
          git clone --quiet --depth 1 --branch v0.16.0 https://github.com/lunarmodules/luacov.git "$RUNNER_TEMP/luacov"
          echo "LUA_PATH=$RUNNER_TEMP/luacov/src/?.lua;;" >> "$GITHUB_ENV"

      - name: Unit specs and release coverage gates
        run: |
          set -euo pipefail
          bash scripts/run_lua_coverage.sh
          tool="$RUNNER_TEMP/coverage-tooling/scripts/coverage_tools.py"
          export COVERAGE_REPO="$GITHUB_WORKSPACE"
          python3 "$tool" merge --all-files --out coverage/combined.stats.out coverage/unit.stats.out "$RUNNER_TEMP/emulator-coverage"
          python3 "$tool" report coverage/combined.stats.out coverage/combined.report.out
          python3 "$tool" gate --mode release --unit coverage/unit.report.out --combined coverage/combined.report.out \
            --base origin/main --head HEAD --history "$RUNNER_TEMP/baseline/history.jsonl" \
            --summary coverage/release-gate.md --json coverage/release-gate.json
          cat coverage/release-gate.md >> "$GITHUB_STEP_SUMMARY"

      - name: Reject unpersisted earlier release floors
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.resolve.outputs.target_sha }}
        run: |
          python3 "$RUNNER_TEMP/coverage-tooling/scripts/download_emulator_coverage.py" \
            --repo "$GITHUB_REPOSITORY" --run "$GITHUB_RUN_ID" --expected-sha "$TARGET_SHA" \
            --require-release-history "$RUNNER_TEMP/baseline/history.jsonl" --current-gate coverage/release-gate.json

      - name: Upload release coverage evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-coverage
          path: |
            coverage/*.report.out
            coverage/release-gate.*
          retention-days: 30

  persist-coverage:
    name: Persist accepted release coverage
    needs: [resolve, coverage]
    if: needs.resolve.outputs.candidate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout measured candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout coverage tooling
        run: |
          tools="$RUNNER_TEMP/coverage-tooling"
          git init --quiet "$tools"
          git -C "$tools" sparse-checkout set --no-cone /scripts/download_emulator_coverage.py /scripts/coverage_tools.py
          GIT_TERMINAL_PROMPT=0 git -C "$tools" -c credential.helper= fetch --quiet --depth 1 \
            "https://github.com/$GITHUB_REPOSITORY.git" "$GITHUB_WORKFLOW_SHA"
          git -C "$tools" checkout --quiet --detach FETCH_HEAD

      - name: Download accepted measurement
        uses: actions/download-artifact@v7
        with:
          name: release-coverage
          path: ${{ runner.temp }}/accepted-coverage

      - name: Persist main measurement before publication
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.resolve.outputs.target_sha }}
          COVERAGE_REPO: ${{ github.workspace }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SHA"
          git fetch --quiet --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "Package-only candidate is outside main; main coverage history is unchanged."
            exit 0
          fi
          reports="$RUNNER_TEMP/accepted-coverage"
          jq -e --arg sha "$SHA" '.mode == "release" and .passed == true and .measured_sha == $sha' \
            "$reports/release-gate.json" >/dev/null
          site="$RUNNER_TEMP/coverage-site"
          tool="$RUNNER_TEMP/coverage-tooling/scripts/coverage_tools.py"
          publish() {
            git fetch --quiet --no-tags origin main:refs/remotes/origin/main || return 1
            git merge-base --is-ancestor "$SHA" origin/main || return 1
            git fetch --quiet --no-tags origin +coverage:refs/remotes/origin/coverage || return 1
            if [[ -d "$site" ]]; then
              git -C "$site" checkout -q -B coverage origin/coverage || return 1
            else
              git worktree add -q -B coverage "$site" origin/coverage || return 1
            fi
            python3 "$tool" gate --mode release --unit "$reports/unit.report.out" \
              --combined "$reports/combined.report.out" --base origin/main --head "$SHA" \
              --history "$site/history.jsonl" || return 1
            python3 "$tool" baseline --unit "$reports/unit.report.out" --combined "$reports/combined.report.out" \
              --sha "$SHA" --run-url "$RUN_URL" --out-dir "$site" || return 1
            git -C "$site" add baseline.json history.jsonl badge-unit.json badge.json README.md || return 1
            if git -C "$site" diff --cached --quiet; then return 0; fi
            git -C "$site" -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "coverage: release ${SHA:0:8}" || return 1
            git -C "$site" -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin coverage
          }
          for attempt in 1 2 3 4 5; do
            if publish; then exit 0; fi
            if (( attempt == 5 )); then
              echo "::error::Could not persist accepted release coverage; retry this Release before another candidate."
              exit 1
            fi
            sleep $((attempt * 5))
          done

  package-and-release:
    name: Package and publish validated candidate
    needs: [resolve, integration, coverage, persist-coverage]
    if: needs.resolve.outputs.candidate == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout validated candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build plugin package
        if: needs.resolve.outputs.candidate == 'true'
        run: bash scripts/package_release.sh "${{ needs.resolve.outputs.archive }}"

      - name: Generate checksum
        if: needs.resolve.outputs.candidate == 'true'
        run: |
          archive="${{ needs.resolve.outputs.archive }}"
          (
            cd "$(dirname "$archive")"
            sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256"
          )
          cat "${{ needs.resolve.outputs.archive }}.sha256"

      - name: Verify package contents
        if: needs.resolve.outputs.candidate == 'true'
        run: |
          unzip -l "${{ needs.resolve.outputs.archive }}"
          test "$(unzip -Z1 "${{ needs.resolve.outputs.archive }}" | head -n 1)" \
            = "weread.koplugin/"
          unzip -Z1 "${{ needs.resolve.outputs.archive }}" \
            | grep -qx "weread.koplugin/main.lua"
          unzip -Z1 "${{ needs.resolve.outputs.archive }}" \
            | grep -qx "weread.koplugin/_meta.lua"
          unzip -Z1 "${{ needs.resolve.outputs.archive }}" \
            | grep -qx "weread.koplugin/icons/weread-w-book.svg"
          unzip -Z1 "${{ needs.resolve.outputs.archive }}" \
            | grep -qx "weread.koplugin/integrations/init.lua"
          unzip -Z1 "${{ needs.resolve.outputs.archive }}" \
            | grep -qx "weread.koplugin/integrations/zenui.lua"
          if unzip -Z1 "${{ needs.resolve.outputs.archive }}" \
            | grep -Eq '^weread\.koplugin/(spec|scripts|docs|\.github)/'; then
            echo "error: development-only files were included in the release package" >&2
            exit 1
          fi

      - name: Upload plugin package artifact
        if: needs.resolve.outputs.candidate == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ needs.resolve.outputs.artifact_name }}
          path: ${{ needs.resolve.outputs.archive }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload checksum artifact
        if: needs.resolve.outputs.candidate == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ needs.resolve.outputs.artifact_name }}-checksum
          path: ${{ needs.resolve.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Ensure release tag is new
        if: needs.resolve.outputs.publish == 'true'
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          if git rev-parse --verify --quiet "refs/tags/$TAG"; then
            echo "error: tag $TAG already exists; bump _meta.lua to a new version" >&2
            exit 1
          fi

      - name: Build release notes preface
        if: needs.resolve.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          bash scripts/extract_release_notes.sh \
            "$VERSION" \
            dist/release-preface.md
          cat dist/release-preface.md

      - name: Verify updater asset names
        if: needs.resolve.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          ARCHIVE: ${{ needs.resolve.outputs.archive }}
        run: |
          # weread/lib/updater.lua parse_release() expects exactly these names.
          test "$(basename "$ARCHIVE")" = "weread.koplugin-v$VERSION.zip"
          test -f "$ARCHIVE.sha256"
          grep -q 'Updater.RELEASE_PREFIX = "https://github.com/'"$GITHUB_REPOSITORY"'/releases/download/"' weread/lib/updater.lua
          grep -q 'Updater.API_URL = "https://api.github.com/repos/'"$GITHUB_REPOSITORY"'/releases/latest"' weread/lib/updater.lua

      - name: Create GitHub Release
        if: needs.resolve.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          ARCHIVE: ${{ needs.resolve.outputs.archive }}
          TARGET_SHA: ${{ needs.resolve.outputs.target_sha }}
        run: |
          release_preface="$(cat dist/release-preface.md)"
          gh release create "$TAG" \
            "$ARCHIVE" \
            "$ARCHIVE.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Version $VERSION" \
            --notes "$release_preface" \
            --generate-notes \
            --latest

      - name: Verify published release
        if: needs.resolve.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          test "$latest" = "$TAG"
          mkdir -p "$RUNNER_TEMP/verify" && cd "$RUNNER_TEMP/verify"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p "weread.koplugin-v$VERSION.zip*"
          sha256sum -c "weread.koplugin-v$VERSION.zip.sha256"
