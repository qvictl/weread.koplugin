# Fork-owned workflow (qvictl/weread.koplugin): not part of upstream.
#
# Relays review events to the review gate (review-gate.yml, REVIEW_POLICY.md).
# Review events run the PR's copy of a workflow, so this one has no
# permissions, no secrets and no checkout: it only finishes, and its
# completion (workflow_run) runs the gate from the default branch.

name: Review gate relay

on:
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

permissions: {}

jobs:

  relay:
    name: Relay to the review gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.event.pull_request.base.ref == github.event.repository.default_branch
    steps:
      - name: Relay
        env:
          PR: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event_name }}
        run: echo "Review gate relay - PR $PR, $EVENT"
