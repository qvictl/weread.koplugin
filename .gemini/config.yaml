# Gemini Code Assist (second-opinion AI reviewer) for qvictl/weread.koplugin.
# Format: https://developers.google.com/gemini-code-assist/docs/customize-gemini-behavior-github
# Review priorities: .gemini/styleguide.md (same as .coderabbit.yaml).
# Policy: REVIEW_POLICY.md. Sensitive path: changes need a human.
#
# Gemini reviews when a PR is opened; after new pushes comment `/gemini review`
# to get a review of the head commit (the review gate only counts reviews of
# the head commit).

have_fun: false
memory_config:
  disabled: false
code_review:
  disable: false
  comment_severity_threshold: MEDIUM
  max_review_comments: -1
  pull_request_opened:
    help: false
    summary: true
    code_review: true
    include_drafts: false
ignore_patterns:
  - "fonts/**"
  - "screenshots/**"
  - "icons/**"
  - "spec/fixtures/**"
  - "**/*.epub"
